novel: 麦克白
author: 威廉·莎士比亚
lang: zh
original_lang: en
translator: 朱生豪
dialogue_voice: 声口分两级：女巫唱念的咒语（A1S1、A1S3、A4S1）排成押韵短句，在形式上与人间台词分开；人间台词不分尊卑都是白话散文，层次由语域和说话对象承担——君臣之间用宫廷辞令与谦辞，门房、刺客和麦克德夫之子用市井口语与童言，同一人物按听话人换腔（A3S1
  麦克白对朝臣、独白、对刺客三种口吻）；麦克白夫妇的独白与旁白当众推理，老翁、列诺克斯、医生与侍女等旁观者以评说或反语交代舆论与异象。
diction: 白话散文为骨，嵌入翻译腔的长定语与条件句（「要是……那么……」「为了……起见」）、文言四字格与成语（「视死如归」「一丝不爽」「网开一面」）和陛下、爵士、殿下等宫廷称谓；女巫咒语以押韵七言为主，兼五言、四言、三言，A4S1
  釜边咒语的文言色彩最重；血与手、睡眠、黑夜、不合身的衣服、婴孩与乳、夜鸟等意象跨场反复出现；不少场次收在格言式散文句上（「以不义开始的事情，必须用罪恶使它巩固」「黑夜无论怎样悠长，白昼总会到来的」），押韵收句只见于
  A1S7 的「欺骗/笑脸」。
rhetoric_density: high
stage_direction_style: 本版本的格式：场首说明与上场独立成行、不加括号（「雷电。三女巫上。」「洛斯上。」），下场、声响、旁白和说话对象用全角括号随台词插入（「（同下。）」「（内敲门声）」「（旁白）」「（向班柯）」）；指示只记进出、声响和超自然显现，不写心理；雷电、号角、喇叭奏花腔、钟声、敲门声、幕后哭声、旗鼓前导等声响承担转场与压迫，超自然场面的视觉说明用文言短句（A4S1「为一戴盔之头」「作国王装束者八人次第上」）；擦手、拉帽遮额、披甲、火把熄灭这类动作不入指示，由台词转述。
pacing: 二十七场长短悬殊，A1S1、A5S6 只有几行，A4S3 是长段对长段的试探与报丧；独白停驻常被一记声响切断（A2S1 钟声、A2S2 敲门声、A5S5
  哭声），心理随即拉回行动；女巫场面按三的节拍组织（三声万福、三个幽灵、三轮咒语副歌），门房段用敲门声打拍；第五幕在城堡内的麦克白与行进中的讨伐军之间逐场交替（A5S2
  至 A5S7），讨伐军的场次一场比一场短，到 A5S7 以号角声衔接交战片段。
signature_moves:
- 咒语押韵分行、人话一律散文：女巫唱念时每句独占一行并押韵，以七言为主，用「（合）」叠唱副歌（A4S1「不惮辛劳不惮烦，釜中沸沫已成澜」）；人物台词不分尊卑都是白话散文，巫与人的界域听韵脚、看分行即可分辨。赫卡忒
  A3S5 的长段训斥和女巫的闲话也是散文，押韵只用于唱念性质的咒语。
- 人间声口靠语域分层：宫廷辞令与谦辞（「犬马微劳」「一瓣心香」）、翻译腔长句的独白、门房与刺客的市井口语、麦克德夫之子的儿化童言各有其位，同一人物按听话人换腔（A3S1
  麦克白对朝臣、独白、对刺客；A5S3 骂仆人、自白、下令交替）；台词形式都是散文，分层全靠用词和句式。
- 独白与旁白当众推理：麦克白的独白用「要是……那么……」的条件句链自我辩驳，逐步推到决定（A1S7、A2S1、A3S1）；旁白以括注「（旁白）」「（向……）」在同一段台词里切开公开应酬与私下盘算（A1S3、A1S4），观众始终比台上其他人物多知道一层。
- 一记声响切断停驻：钟声（A2S1）、敲门声（A2S2、A2S3）、幕后妇女哭声（A5S5）、号角（A5S7）打断独白，或把台下发生的事送上台；指示只写声响名称，人物的反应由台词接住（「那打门的声音是从什么地方来的？」）。
- 动作与神情由台词转述：梦游擦手由医生说出（A5S1「瞧，她在擦着手」），拉帽遮额由马尔康点破（A4S3），披甲脱甲由麦克白自己下令（A5S3），火把熄灭由刺客追问（A3S3）；指示只管进出、声响与超自然显现，台词同时承担叙述动作。
- 礼仪场面与观众已知的杀机同台：迎驾（A1S6）、宣立储君（A1S4）、宴会（A3S4）中的客套与谦辞照常进行，指示和台词都不加旁注，反讽由观众自己对照。
- 预言按字面兑现：幽灵用「除非有一天勃南的树林会……移动」「没有一个妇人所生下的人可以伤害麦克白」立约（A4S1），麦克白在 A5S3、A5S5 反复引述原句给自己壮胆，第五幕由士兵手持树枝（A5S4、A5S6）和「没有足月就从他母亲的腹中剖出来」（A5S7）逐字兑现；成立条件是预言措辞留有另一种字面读法。
- 意象与原句回环：不合身的衣服在多场重现（A1S3「借来的衣服」、A2S4「新衣服不及旧衣服舒服」、A5S2「偷儿穿了一件巨人的衣服」），血与手、睡眠、黑夜同样跨场复现；A5S1
  的梦呓把 A2S2「披上你的睡衣」、A3S2「事情干了就算了」和敲门声原样带回，观众凭旧句认出旧事。
anti_signature:
- 把女巫咒语写成散文，或把人物台词也排成分行韵文：本版本巫与人的界域靠韵文与散文的形式差区分，两边同形之后，女巫一开口就听不出界域切换。
- 台词通篇改成简短的现代口语，或通篇改成文言：本版本台词是白话句法里嵌长定语、四字格和宫廷称谓，宫廷辞令、独白与市井口语的分层建立在这种混合上，单取一端会抹平语域差别。
- 在舞台指示里写心理、神情或大段氛围：本版本指示只记进出、声响和超自然显现，擦手、拉帽遮额这类动作交给台词转述；移进指示，旁观者转述动作的台词就没了用处。
- 独白只抒发情绪、不走推理：麦克白的独白靠条件句一步步推到决定，去掉推理链，决定就失去来路，旁白与公开言语的落差也随之变小。
- 把关键死亡搬到台上正面铺演：邓肯、麦克德夫夫人、王后与麦克白之死都在台下，只给声响、血手或首级；正面铺演会把恐怖从旁观者的反应转到动作场面本身。
author_cross_ref: 任务包提供的同作者卡是本剧英文原版（dramas/Macbeth）：声响指示转场、独白当众推理、礼仪场景藏杀机、关键暴力放在台下这几项在朱译中都保留；差别在声口分层的手段，原版卡记的是巫咒唱韵、人语素体诗、底层人物转散文的格律分层，朱译只把女巫唱念的咒语译成押韵短句，人物台词不分尊卑都成了白话散文，分层改由宫廷辞令、翻译腔长句与市井口语等语域承担，这一差别属于译本选择。
