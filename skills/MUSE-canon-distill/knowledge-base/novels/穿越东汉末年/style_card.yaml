novel: 穿越东汉末年
author: 佚名
lang: zh
original_lang: zh
translator: ''
# 视频口播转文字，文风可参考；写作范文默认不取，--novel 点名才用（设计 §4.2）
exemplar_pool: on_request
narration_voice: 第一人称“攻略解说”体：叙述者自称“我”，开篇交代“由于我在讲述……暂时代入是我的意识传过去了”，此后用“咱们”“我们”“你”把听众拉进主角刘官章的每一次权衡，又常以第三人称（“刘官章当即表示”“我们刘官章”）称呼同一个人；叙述者全程直评人物和局势，拿“正史”对照“这条时间线”，并直接对听众和历史人物说话。阶段差异：第1–3期求生阶段多焦虑自语（S04“这可怎么办呢？”），中段是谋略解说加谈判现场，第26期成了制度讲解课（S54）；另有数处越出第一人称所知，用不标说话人的群臣议事（S27）、多地快切的群像短会（S38、S48）、钻进刘备或曹操内心（S31、S47）和战史式转述（S40）交代主角不在场的事。
diction: 网络口语打底（“直接寄”“优势在我”“已读不回”“官渡体验卡”“演我”“求生欲拉满”“点科技树”），密集嵌入汉代制度、官职、兵器和农工术语（佃客、乡佐、啬夫、斛、灌钢法、人马具甲、三省六部）以及钱粮户口数字；文言只在书信、檄文、诏书和对白里成段出现，并按对象切换：对士族名臣说文白客套，内心独白里是粗口（S13“这逼果然骗我”）；时代错置的知识（糖尿病症状、攀枝花铁矿储量、土豆、电报）多由叙述者以现代人身份说出，汉末人物偶尔借现代口头语制造笑点（S45麻将“点炮”、S47孙权“我也想进步”）。
rhetoric_density: low
dialogue_mode: 叙述推进为主，对白不加引号，以“某某道”“说道”“表示”“当即表示”引出（“刘官章当即表示”最常见），后面常紧跟叙述者对说话用意的拆解；对白集中在谈判、招揽和会晤（S09甘宁与严颜、S19马超、S33诸葛亮、S35与S47曹操），多靠连环追问或前倨后恭制造笑点；全文照录的书信、檄文、诏书和诗承担了大量人物发声（S08、S16、S21、S53）；少数场次整段对白不标说话人，只能从称呼和内容辨认（S27、S38）。第1–3期除一段动员演讲（S05）外几乎没有对白。
pacing: 按年月推进的编年流水，“随后”“同时”“184年3月”式开句高频，每期大致循环“难题—方案—算账—结果—下一个难题”；长句逗号串联，段落常在句中断开；战斗、死亡和亲情多压缩成一两句（S20夫人病逝后紧接军器司产量），篇幅留给账目、技术工序和制度条款；名场面才放慢为逐句对答或全文照录（S13、S47、S53）。各期结尾多是悬念句或未完句，有的不带句号（S13“我拿什么耗啊”、S43、S53）。
signature_moves:
- 攻略式代入：叙述者用“咱们”“你”向听众交代规矩与利弊（“不要想着造火药”“千万要记住”），把每个选择讲成可复盘的操作；成立条件是穿越前提加上与听众共享的现代常识，且主角的优势被限定在识字、算账和当时能落地的改良上（S01、S02、S06）。
- 账本化冲突：用钱、粮、户、兵和运粮折损（“100斤粮食运到前线能剩下40斤”）给每个决策定价，悬念来自资源够不够，而不是武力高低；同一期内的数字需要前后对得上（S03、S16、S18）。
- 双声道反差：场面上是文言礼辞，心里是粗口判断，两者紧挨着写（S13对严颜、S11对冯家与賨人、S36平顶山谈成后心里一句“完了给高了”）；前提是叙述者的粗俗人设已经立住，且场面话和心里话指向同一判断的两面。
- 历史预知既当武器又当笑点：主角凭读者熟知的三国史料抢先布局或当面揭秘，形成戏剧反讽（S30用守险失地的假设考马谡、S47说出吕伯奢旧事和伏完密信、S44用“贺家一百多口，一夜之间全都死了”的过去时下令）；需要读者认得出所指史事。
- 名场面换位重演：煮酒论英雄（S21、S47）、如鱼得水（S33）、孙权劝学（S45）、黄袍加身（S53）被搬到主角身上，保留原台词骨架而调换说话人或结局，在熟悉感里制造错位。
- 政治表演与旁白拆台并置：先写城头痛哭、三辞称公、劝进推辞的台词，再由叙述者点破算计或用一句反讽收尾（S42、S43、S53），读者同时看到台前表演和背后盘算。
- 整篇嵌入异体文本：檄文、尺牍、诏书、乐府体长诗全文照录（S08、S16、S21、S53），在口语叙述中造成文体落差并放慢节奏；嵌入文本本身守得住格式与文体，反差才成立。
- 多机位群像短会：主角不在场或装病时，快切各地阵营，每处一段短对白亮出立场（S38、S48）；用在需要一次检验多方忠诚或反应的节点。
- 知识边界自陈：叙述者承认自己不会、造不出（“我知道的就这么多，剩下的你们自己去研究吧”“风帆战舰……造不了”“得有橡胶，但是咱讲不出来”），技术进展受材料、工匠和时间约束，穿越者因此不是全能（S07、S29、S49、S55）。
anti_signature:
- 改成第三人称文学散文并补足环境、感官描写：会失去叙述者与听众同场算计的口播在场感，原作的张力来自“咱们”当下的权衡，而不是场景氛围。
- 把账目数字概括成“粮食充足”“损失惨重”：资源约束一消失，决策就没有代价，本作的悬念来源随之失效。
- 让主角提前造出蒸汽机或大规模火器等越过当时材料与工匠条件的技术：原作早期明言蒸汽机“生产力不允许”，铜炮到第13期才出现，且受耗铁、炸膛和运输限制；越界会拆掉可信度的前提。
- 在叙述层堆比喻和抒情：原作的修辞集中在嵌入的檄文、陈词和诗里，叙述层保持平白；叙述层变华丽会抹平两层之间的反差。
- 为暴力决定写长篇道德辩护或谴责：原作对灭门、屠族、不留俘虏只作平铺陈述随即转入下一件事（S44、S51、S53），冷处理本身构成反讽，补上评判会改变这种语域。
- 把段中断句和同音误字（“马中”与“马忠”、“蔡衍”与“蔡琰”）当作手法模仿：这些来自口播转写，不承担表达功能。
