novel: 简·爱
author: 夏洛蒂·勃朗特
lang: zh
original_lang: en
translator: ''
narration_voice: 已读 28 场全部是简·爱的第一人称回溯，叙述者站在婚后十年的时点（S28“如今我已结婚十年了”）讲述从十岁起的经历。常见的是双重视角：先贴着当时的感受写，再由成年叙述者补出事后的理解或替对手说公道话（S02“现在的我会很自然地联想到……”、S07“当时我幼稚无知”、S22“我不责备任何一个冷言拒绝我的人”）。叙述者经常直接对读者说话，多在过渡、为自己的叙述或选择辩护、情感峰值处出现（S08、S10、S13、S21、S22、S24、S26、S27、S28）。内心场景有几种固定写法：连串设问（S02、S23）、第二人称自我审判与法庭拟人（S14）、第三人称自称（S20“简·爱，那个曾经热切期盼的女人……”）、良心理智感情的争辩（S21）、自问自答（S08）。悬疑场次则收紧到当时所知，不提前解释（S13、S15、S16）；S10
  几乎全是议论，S08、S28 有大段概述。
diction: 当前译本是流畅的现代书面白话，四字成语较密（逆来顺受、锱铢必较、灰飞烟灭），常用括号补充或自评，正文夹注释序号（如“毕维克注1”）。名物具体：陈设、服饰、花木多点名（S02
  的红房间、S06 女眷的华服、S07 的花园、S09 的客厅）。人物的语域分得开：罗切斯特口语化、跳跃、自嘲比喻连发（S12 的橡皮球与生锈的钉子、S18 的左肋细弦、S21
  的芦苇与囚笼）；布罗克赫斯特把圣经腔与琐碎账目混在一起（S03、S06）；海伦平静的教义语言（S05、S07）；圣约翰使徒口吻的宗教与军事词汇（S23、S24、S25）；里德夫人由冷硬到临终谵语（S04、S17）；仆人和旅店老板的乡间口语（S26、S28）。圣经、《天路历程》与诗句的引用较多，在宗教情境和结尾尤其集中（S20、S25、S28）。
rhetoric_density: medium
dialogue_mode: 对白一律加引号，归属多用“他说”“我答道”，快速问答时常省略归属；简的心声也用引号（“我心想”），与说出口的话交错。最有辨识度的是力量不对称的对话：强势一方长篇说教、劝诱或自白，简以极短的回答、沉默或一句有分量的反驳应对（S03
  的地狱问答、S12“不，先生。”、S21 连续三个“是的。”、S24 与圣约翰的攻防），在少数关键处才换成简一口气的长段宣言（S04、S19）。对白常承担揭秘：化装试探（S15）、临终自白与信件（S17）、旅店老板不知情的转述（S26）。也有整场几乎没有人与人对话、只靠叙述和自我对话推进的场次（S02、S08、S10、S22
  前半）。
pacing: 场景常以天气、景物或空间开头（S01 冬雨、S11 冬日小路、S18 仲夏暮色、S27 雨中密林），再引出事件；悬疑段用声音逐级升级（S13、S16），动作段句子变短，内心段落变长。高潮多在一个具体动作或象征性的单句处截住，不写余波（S01“把我拖上楼去”、S15
  揭面、S19 七叶树被劈成两半）；死亡多以事后得知或一句陈述交代（S07“而海伦——死了”、S17 当晚去世）。时间跨度大的地方用概述压缩（S08 跳过八年、S28
  婚后十年），一个下午的凝望或一夜的守候则写得很长（S08 窗前、S16 守夜）。不少场次以一段反思或一句对读者的话收尾。
signature_moves:
- 回溯视角的双层叙述：先写当时的误判、恐惧或冲动，再由成年叙述者补一句事后理解（S02 的灯笼、S07 对肺痨的误解、S25“这两次，我都做了傻瓜”）；成立条件是第一人称回溯且叙述时点远离事件，读者既看到当时的局限，也看到人物后来的成长。
- 力量不对称的对白：对方长篇大论，简用极短的回答或沉默守住立场，把克制本身写成性格（S03、S12、S21、S24）；前面压得越久，简在关键处的长段宣言越有力（S04
  痛斥里德夫人、S19“我和您一样，有完美的心灵！”）。
- 内心冲突外化为几个声音的辩论或审判：记忆与理智出庭作证、第二人称宣判（S14），良心理智与感情争辩后给出“我在乎我自己”的回答（S21），两种生活的对照设问（S23）；适用于人物必须在欲望与原则之间作出决定的场次。
- 直接呼告读者：在转场、为叙述方式辩护或情感峰值时请读者在场（S10“浪漫的读者，请恕我直言！”、S21“仁慈的读者，但愿你永远不用感受我当时的心情！”、S26
  先讲一个爱人酣睡实已死去的比喻故事再揭示废墟、S28“读者，我和他结了婚”）。
- 景物与天气承担对照或预兆：冬雨窗景配孤立处境（S01），春花与棺木并存（S07），仲夏暮色转雷雨、七叶树被劈（S18、S19），失恋时用季节倒错的意象（S20
  圣诞的霜冻在仲夏降临）；景物出现在场首或转折处，且与人物处境有可读的对应。
- 哥特悬疑先写声音、后以平庸现实暂时消解：笑声、呢喃、尖叫逐级升级，只给当时能知道的信息，再用格雷斯·普尔平庸的外貌和一壶黑啤酒把怪异按下去（S09、S10、S13、S16），真相留到
  S20 才揭开。
- 让伪善者用自己的话暴露自己：布罗克赫斯特一边讲克己苦行，一边计较针线面包、对照自家女眷的华服（S03、S06），叙述者少作评判，讽刺由并置产生。
anti_signature:
- 把简写成随时倾诉、频繁哭诉的叙述者：会抹掉短答与沉默制造的张力，S04、S19 的长段爆发也就失去了前面的压抑作对比。
- 在悬疑段提前点破怪声或怪事的真相：S13、S16 的效果依赖只写当时所知，提前解释会把悬念变成说明。
- 每段都对读者说话：原作只在过渡、辩护和情感峰值使用呼告，用得过密会变成腔调。
- 由叙述者直接痛骂伪善人物：S03、S06 的喜剧与讽刺来自人物自己的话与场面并置，替读者下判词会削弱效果。
- 改用第三人称全知写内心场景：自我审判、法庭拟人、成年回顾的双重视角都依赖第一人称回溯的声音，换成全知视角这些手法无处安放。
