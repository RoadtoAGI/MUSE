novel: 红与黑
author: 司汤达
lang: zh
original_lang: fr
translator: 罗新璋
narration_voice: 已读 28 场都是第三人称全知叙述，在人物心中自由出入：以于连为主轴，上卷常与瑞那夫人交替（S03、S07、S09），下卷加入玛娣儿特的独白（S17、S21），也会把整场交给次要人物（S08
  瑞那先生的通宵盘算）。叙述者贴身而不认同，称主角'我们的英雄'，随时下断语、对读者说话（S09'假如读者还记得'、S12'诸君看了或许会窃笑'），并以'我''作者'身份表态或为作品辩护（S10'我的评价不高'、S21
  四段括号插话、S22 与出版家的对谈）。少数场次刻意退场：S15 让两位乘客自说自话，S23 枪击与 S28 行刑只写外在动作。
diction: 罗新璋译本以白话为骨，文言四字格与成语密集（疏疏密密、惶惶不可终日、庶几仿佛），间用'焉能''也者''殊觉'一类古雅词语。人物的社会身份靠语域落差区分：市长的公文腔（S08）、索雷尔老爹的粗口（S02）、汝拉山区俗语'大佬倌''硬通货'（S12）、教会术语与拉丁原文（S11、S12）、沙龙俏皮话（S16）、政治时评词汇（S15、S22）。法郎、路易等钱数随处出现（S02
  一年三百法郎的工钱、S10 九法郎一瓶的莱茵酒、S27 六法郎的香槟），把情感场面拉回利害。外文唱词与拉丁语保留原文并加括注，正文夹带译注序号。
rhetoric_density: low
dialogue_mode: 对白一律加引号，归属多用'答道''嚷道''冷冷说道'并附神态；人物心声也用引号和'他心里想''暗忖'标出，与说出口的话同形交错，形成说一套、想一套的双轨（S03、S09、S24），S08、S18、S27
  几乎整场由这种独白撑起。对白长短两极：交锋处多是短问短答，常由一句话翻转局面（S02'那我跟谁一起吃饭呢？'、S20'碰到阿狗阿猫'、S24'怎么！她没死！'）；议政、训诫与法庭陈词则是整段长篇（S15、S22、S25）。群像用无名者或小团体的接力短评（S06、S16、S17），书信全文引入承担转折（S23、S24）；S01、S12、S28
  这类议论或概述场次几乎没有对白。
pacing: 分析放慢与行动骤发交替：动机与心理以长段落层层剖析，决定性动作只用一两句完成（S02 一拳一掌、S20 拔剑又挂回、S23 两枪、S28'整个过程，简单而又得体'）。悬念常以钟点计时（S04
  九点三刻到十点、S19 十一点到一点零五分、S25 午夜到两点）。场次之间用'过了一会儿''第二天''几天之后'跳接，数周数月可压成一段概述（S07、S12、S28）。情欲与私密时刻省略（S19
  初夜一句带过、S21'此中情形，不写为妙'）。场末多收在一句讽刺或自问上（S05 雄鹰之问、S10'混账！'、S13 节省下的蜡烛、S20'谁能指点指点我呢？'）。
signature_moves:
- 把情感行动写成'职责'与战役：人物先在独白里把握手、幽会、回信当作必须打赢的仗来盘算（S04 职责对怯懦之战、S18 想象被恶仆围攻夺信、S19 揣着手枪爬梯），叙述者逐层点破，再让行动在某个钟点骤然发生；成立条件是人物自尊极强又处于社会劣势，读者先看到算计，行动的反讽才成立。
- 叙述者现身表态：以'我们的英雄'、对读者发话或'作者'口吻插话，紧贴刚发生的场面给出评判或为作品辩护（S10 评于连的软心肠、S12 向读者发话、S21 小说是沿大路行走的镜子、S22
  政治是音乐会中的一声枪响）；多数插话比场面本身短，S21、S22 的括号插话则整段打断叙事。
- 引号心声与对白同形交织：说出口的话与'心里想'的话都用引号，一来一往并排呈现，人物当面说一套、心里想一套（S03 的称呼之争、S09 的'总算成了！'、S24
  看守绕弯子时于连的盘算），也能撑起整场独白（S08、S27）。
- 一句短话翻转局面：关键处只给一句话或一个词，前文铺足的自尊、恐惧或利害在这一句上转向（S02'那我跟谁一起吃饭呢？'、S20'碰到阿狗阿猫'、S24'怎么！她没死！'、S27'我存着不少钱呢！'）；成立条件是前文已把这句话触碰的利害写清。
- 用实物和钱数代替道德评语：峨冠的戴法（S06）、九法郎一瓶的莱茵酒与被喝止的小曲（S10）、溏心蛋与酸菜烧腊肠（S12）、节省下的十斤蜡烛（S13）、香槟与遗产账（S27），让虚荣与伪善在物件和价目上自己显形。
- 极点事件压缩、前因展开：枪击、行刑、初夜只用一两句交代（S23'便一枪打去，却没打中。再开第二枪，她颓然倒下。'、S28 行刑一句、S19 初夜一句），之前的心理盘算与之后的余波却写得很长；成立条件是读者已掌握人物动机，压缩才形成冲击而不显潦草。
- 上下卷对位：同一类场面在两卷重现，后场借前场的记忆生出意义——梯子之夜（S14 与 S19、S21，S19 中于连直接拿维璃叶的最后一夜作比）、在教堂祈祷的瑞那夫人（S13
  告解亭重逢、S23 举扬圣体时开枪）、山崖远眺（S05）与山洞安葬（S28）；前一场的细节要具体到可以被认出。
- 群像用接力短评而非全景：城中议论（S06）、蓝色长沙发上的小团体（S16）、舞会门口的小胡子（S17）、法庭楼座上的贵妇（S25）都以每人一两句评语或反应呈现，叙述者不作整体场面描写，于连多半在一旁听。
anti_signature:
- 只抒情或只讽刺：于连与两位女主人公的心理在已读场次里同时被贴近和讥讽（S04、S18、S21），只写深情会丢掉叙述者的冷眼，只写算计会丢掉同情，人物就成了单面的情种或阴谋家。
- 通篇铺排比喻与景物：已读场次的意象集中在少数场合与物件（S05 雄鹰、S13 钟声、S20 古剑），多数场面靠分析和对白推进；处处设喻会冲淡分析性叙述的冷静，也让这几处意象失去分量。
- 把枪击、行刑、初夜放慢细描：本作以压缩制造冲击（S23、S28、S19），逐步铺陈会让前文心理分析的比重失衡，结局的克制感随之消失。
- 删去叙述者议论、只留客观场面：作品对复辟时期外省与上流社会的判断，很大部分由叙述者的直评和插话承担（S01、S10、S12、S22），只留场面时，人物的自欺与叙述者的判断之间的落差就看不出来。
- 把内心话改成不加引号的意识流：本版本心声一律带引号和'心里想'标记，与对白并排；去掉标记后，说出口与没说出口的话混在一起，'说一套想一套'的对照随之消失。
- 全部改用现代口语或全部改用文言：罗译在白话骨架里嵌四字格、古雅词语和各阶层的专门语汇，人物身份靠这种语域落差区分（S02、S08、S12、S16）；只取一端会抹平层次。
