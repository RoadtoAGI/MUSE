card_id: climax-scale-shrink
pattern_name: 尺度收缩高潮
dramatic_function: 对抗宏大叙事高潮的空洞化：越重大的命题配越小的承载物，文明命运压进五公斤生态球或一口气，物理量替代情感量
applicability: 须前文建立小物件与大命题的换算关系，物件须可触可称量；无铺垫的小道具只是装饰不是浓缩（单书孤证，验证面窄）
reuse_candidates:
- 生态球/头发/雪茄具体道具
- 小宇宙归还设定
