card_id: virtue-as-tragic-flaw
pattern_name: 美德即陷阱·善意致祸
dramatic_function: 把读者认同的美德设为悲剧缺陷：高贵品质被对手作价利用，爱与救助酿成不可逆灾难与伦理债；叙述悲悯而不辩护
applicability: 适用于权谋、史诗与群体求生题材；选择与后果的因果链须可信且代价真实落地；世界观奖励美德或后果可挽回即沦为爽文
