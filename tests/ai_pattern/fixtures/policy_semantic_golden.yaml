# Static pre-migration directive oracle.  These records deliberately include
# a high-severity M-sovereignty family so high -> S cannot drift to high -> M.
directive_levels:
  - family: action_log
    language: zh
    severity: high
    cluster: action_log
    expected: S
  - family: action_log
    language: zh
    severity: medium
    cluster: action_log
    expected: M
  - family: figurative_debt
    language: zh
    severity: medium
    cluster: figurative_debt
    expected: M
  - family: marker_pollution
    language: zh
    severity: medium
    cluster: lexical_cliche
    expected: S
  - family: marker_pollution
    language: zh
    severity: low
    cluster: lexical_cliche
    expected: L

